
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Available Jobs - JobConnect</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">JobConnect</a>
        <a href="/" class="btn btn-outline-light">Home</a>
    </div>
</nav>

<div class="container my-5">

    <h2 class="text-center mb-4">Available Jobs</h2>

    <div class="row">

        <div class="col-md-6 mb-4" th:each="job : ${jobs}">

            <div class="card shadow h-100">
                <div class="card-body">

                    <h4 class="card-title" th:text="${job.title}"></h4>

                    <h6 class="text-primary"
                        th:text="${job.companyName}"></h6>

                    <p>
                        <strong>Location:</strong>
                        <span th:text="${job.location}"></span>
                    </p>

                    <p>
                        <strong>Job Type:</strong>
                        <span th:text="${job.jobType}"></span>
                    </p>

                    <p>
                        <strong>Salary:</strong>
                        <span th:text="${job.salary}"></span>
                    </p>

                    <p th:text="${job.description}"></p>

                    <a href="/login" class="btn btn-primary">
                        Apply Now
                    </a>

                </div>
            </div>

        </div>

    </div>

    <div th:if="${#lists.isEmpty(jobs)}" class="alert alert-info text-center">
        No jobs available currently.
    </div>

</div>

</body>
</html>
