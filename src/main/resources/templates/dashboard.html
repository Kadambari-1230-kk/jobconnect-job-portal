
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Dashboard - JobConnect</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">

            <a class="navbar-brand fw-bold" href="/">
                JobConnect
            </a>

            <div>
                <a href="/" class="btn btn-outline-light me-2">
                    Home
                </a>

                <a href="/jobs" class="btn btn-light me-2">
                    Explore Jobs
                </a>

                <a href="/logout" class="btn btn-danger">
                    Logout
                </a>
            </div>

        </div>
    </nav>

    <!-- Dashboard Content -->
    <div class="container my-5">

        <div class="card shadow p-5 text-center">

            <h2>Welcome to JobConnect!</h2>

            <h4 class="text-primary mt-3">
                Hello,
                <span th:text="${userName}"></span>!
            </h4>

            <p class="mt-3">
                Your login was successful.
                You can now explore jobs and apply for opportunities.
            </p>

            <div class="mt-4">

                <a href="/jobs" class="btn btn-primary btn-lg">
                    Explore Jobs
                </a>

            </div>

        </div>

    </div>

</body>
</html>
